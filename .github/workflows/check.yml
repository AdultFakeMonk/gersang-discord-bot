name: Check Gersang notices and events

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gersang-news-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check notices and events
        env:
          DISCORD_NOTICE_WEBHOOK_URL: ${{ secrets.DISCORD_NOTICE_WEBHOOK_URL }}
          DISCORD_EVENT_WEBHOOK_URL: ${{ secrets.DISCORD_EVENT_WEBHOOK_URL }}
          MAX_SEND_PER_RUN: "5"
        run: python main.py

      - name: Save state
        run: |
          if git diff --quiet -- last_seen.json; then
            echo "No state change"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add last_seen.json
          git commit -m "Update Gersang watcher state"
          git push
